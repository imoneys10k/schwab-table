name: install-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install (git clone path)
        run: |
          sh ./install.sh --dir "$RUNNER_TEMP/skill-git/schwab-performance-table"
          test -f "$RUNNER_TEMP/skill-git/quarterly-earnings-review/project.json"
          "$RUNNER_TEMP/skill-git/schwab-performance-table/.venv/bin/python" "$RUNNER_TEMP/skill-git/quarterly-earnings-review/scripts/review.py" AAPL --period FY2025Q3 --facts "$RUNNER_TEMP/skill-git/schwab-performance-table/examples/earnings/aapl_2025q3_facts.json" -o "$RUNNER_TEMP/installed-earnings" --no-png
      - name: Install (tarball path, no git)
        run: |
          mkdir -p "$RUNNER_TEMP/nogit"
          for t in curl tar gzip sh mktemp dirname mkdir ls sed uname rm cat python3; do ln -sf "$(command -v $t)" "$RUNNER_TEMP/nogit/$t"; done
          PATH="$RUNNER_TEMP/nogit" /bin/sh ./install.sh --dir "$RUNNER_TEMP/skill-tar/schwab-performance-table"
          test -f "$RUNNER_TEMP/skill-tar/quarterly-earnings-review/project.json"

      - name: Pin a version, then uninstall
        run: |
          D="$RUNNER_TEMP/skill-ref/schwab-performance-table"
          sh ./install.sh --dir "$D" --ref v0.3.0 --skip-deps
          test -f "$D/SKILL.md"
          sh ./install.sh --dir "$D" --uninstall
          test ! -e "$D"

      - name: Update a pinned install; refuse to uninstall a folder that is not this skill
        run: |
          D="$RUNNER_TEMP/skill-upd/schwab-performance-table"
          sh ./install.sh --dir "$D" --ref v0.3.0 --skip-deps
          test ! -f "$D/csv_to_prices.py"            # v0.3.0 predates this file
          sh ./install.sh --dir "$D" --skip-deps      # no --ref: must move to main, not stay on the tag
          test -f "$D/csv_to_prices.py"
          sh ./install.sh --dir "$D" --skip-deps      # a normal update on the branch still works
          F="$RUNNER_TEMP/foreign"; mkdir -p "$F"; printf -- '---\nname: other\n---\n' > "$F/SKILL.md"
          if sh ./install.sh --dir "$F" --uninstall; then echo "uninstall should have refused"; exit 1; fi
          test -f "$F/SKILL.md"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install (PowerShell 7)
        shell: pwsh
        run: |
          .\install.ps1 -Dir "$env:RUNNER_TEMP\skill-pwsh\schwab-performance-table"
          if (-not (Test-Path "$env:RUNNER_TEMP\skill-pwsh\quarterly-earnings-review\project.json")) { throw "earnings skill registration failed" }
      - name: Install (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\install.ps1 -Dir "$env:RUNNER_TEMP\skill-ps51\schwab-performance-table"
          if (-not (Test-Path "$env:RUNNER_TEMP\skill-ps51\quarterly-earnings-review\project.json")) { throw "earnings skill registration failed" }
      - name: Pin a version, then uninstall
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\skill-ref\schwab-performance-table"
          .\install.ps1 -Dir $d -Ref v0.3.0 -SkipDeps
          if (-not (Test-Path "$d\SKILL.md")) { throw "pinned install failed" }
          .\install.ps1 -Dir $d -Uninstall
          if (Test-Path $d) { throw "uninstall failed" }
      - name: Update a pinned install; refuse to uninstall a folder that is not this skill
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\skill-upd\schwab-performance-table"
          .\install.ps1 -Dir $d -Ref v0.3.0 -SkipDeps
          if (Test-Path "$d\csv_to_prices.py") { throw "v0.3.0 should not have csv_to_prices.py" }
          .\install.ps1 -Dir $d -SkipDeps
          if (-not (Test-Path "$d\csv_to_prices.py")) { throw "update from a pinned install did not move to main" }
          .\install.ps1 -Dir $d -SkipDeps
          $f = "$env:RUNNER_TEMP\foreign"; New-Item -ItemType Directory -Force -Path $f | Out-Null
          Set-Content -Path "$f\SKILL.md" -Value "---`nname: other`n---"
          $refused = $false
          try { .\install.ps1 -Dir $f -Uninstall } catch { $refused = $true }
          if (-not $refused) { throw "uninstall should have refused" }
          if (-not (Test-Path "$f\SKILL.md")) { throw "foreign folder was deleted" }
