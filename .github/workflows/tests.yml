name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Traditional Chinese conversion
        run: python -m pip install "opencc-python-reimplemented>=0.1.7"
      - name: Unit tests (calculations, parsers, CSV import, HTML rendering)
        run: python -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Traditional Chinese conversion
        run: python3 -m pip install "opencc-python-reimplemented>=0.1.7"
      - name: Regenerate HTML examples and check they match the repo
        run: |
          python3 examples/make_sample_prices.py
          for m in neural9 holdings watchlist; do python3 render_table.py examples/${m}_spec.json examples/$m --no-png >/dev/null; done
          for m in morgan blackstone ibkr; do python3 render_table.py examples/${m}_spec.json examples/$m --no-png >/dev/null; done
          for m in chart_lines chart_multiples; do python3 render_chart.py examples/${m}_spec.json examples/$m --no-png >/dev/null; done
          for q in 3 4; do python3 quarterly_earnings.py AAPL --period FY2025Q$q --facts examples/earnings/aapl_2025q${q}_facts.json --analysis examples/earnings/aapl_2025q${q}_analysis.json -o examples/earnings/aapl_2025q$q --no-png >/dev/null; done
          git diff --exit-code -- 'examples/*.html' examples/sample_prices.json
          git diff --exit-code -- 'examples/earnings/*_en.html' 'examples/earnings/*_zh.html'

  # Hits Nasdaq's real API. It is allowed to fail (rate limits, outages) but the result is visible on every push.
  fetch-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Traditional Chinese conversion
        run: python3 -m pip install "opencc-python-reimplemented>=0.1.7"
      - name: Fetch real prices and sanity-check them
        run: |
          python3 fetch_prices.py AAPL --benchmark SPY,COMP -o "$RUNNER_TEMP/p.json"
          python3 - "$RUNNER_TEMP/p.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d["series"]
          assert s["COMP"]["class"] == "index", "COMP must be looked up as the Nasdaq Composite index, not a stock"
          assert s["SPY"]["class"] == "etf"
          assert len(s["AAPL"]["points"]) > 20
          print("ok:", {k: v["class"] for k, v in s.items()})
          PY
          echo '{"data": "p.json"}' > "$RUNNER_TEMP/spec.json"
          python3 render_chart.py "$RUNNER_TEMP/spec.json" "$RUNNER_TEMP/out" --no-png
