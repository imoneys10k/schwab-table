var IMGS = ["neural9_en", "watchlist_zh", "chart_lines_en", "chart_multiples_zh", "morgan_zh", "blackstone_zh", "ibkr_zh", "aapl_2025q3_zh", "aapl_2025q4_zh", "holdings_en"];

};
var NAMES = {en: "EN", zh: "繁體中文", ja: "日本語", fr: "FR"};
var HTML_LANG = {en: "en", zh: "zh-Hant", ja: "ja", fr: "fr"};
var lang = "en", tab = "unix";
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pick(){
  var saved = null; try { saved = localStorage.getItem("lang"); } catch(e) {}
  if (saved && D[saved]) return saved;
  var n = (navigator.language || "en").toLowerCase();
  return n.indexOf("zh") === 0 ? "zh" : n.indexOf("ja") === 0 ? "ja" : n.indexOf("fr") === 0 ? "fr" : "en";
}
function render(){
  var d = D[lang];
  document.documentElement.lang = HTML_LANG[lang];
  $("ha").textContent = d.hero_a; $("hb").textContent = d.hero_b; $("sub").textContent = d.sub;

  $("t_data").textContent = d.t_data;

  $("cp1").textContent = d.copy; $("cp2").textContent = d.copy;

  Array.prototype.forEach.call($("langs").children, function(b){ b.className = b.getAttribute("data-l") === lang ? "on" : ""; });
  $("tab_unix").className = tab === "unix" ? "on" : ""; $("tab_win").className = tab === "win" ? "on" : "";
}
$("langs").innerHTML = Object.keys(NAMES).map(function(k){return '<button data-l="'+k+'">'+NAMES[k]+'</button>'}).join("");
$("langs").addEventListener("click", function(e){ var l = e.target.getAttribute("data-l"); if (l) { lang = l; try { localStorage.setItem("lang", l); } catch(x) {} render(); } });

$("tab_win").onclick = function(){ tab = "win"; render(); };
function copy(text, btn){
  var done = function(){ btn.textContent = D[lang].copied; setTimeout(function(){ btn.textContent = D[lang].copy; }, 1400); };
  try { navigator.clipboard.writeText(text).then(done, function(){}); } catch(e) {}
}
$("cp1").onclick = function(){ copy(CMDS[tab], this); };

lang = pick(); render();
