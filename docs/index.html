var CMDS = {
  unix: "curl -fsSL https://raw.githubusercontent.com/imoneys10k/schwab-table/main/install.sh | sh",

};
var NAMES = {en: "EN", zh: "中文", ja: "日本語", fr: "FR"};
var IMGS = ["neural9_en", "watchlist_zh", "chart_lines_en", "chart_multiples_zh"];
var lang = "en", tab = "unix";
function $(id){return document.getElementById(id)}
function pick(){
  var saved = null; try { saved = localStorage.getItem("lang"); } catch(e) {}
  if (saved && D[saved]) return saved;
  var n = (navigator.language || "en").toLowerCase();
  return n.indexOf("zh") === 0 ? "zh" : n.indexOf("ja") === 0 ? "ja" : n.indexOf("fr") === 0 ? "fr" : "en";
}
function render(){
  var d = D[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  $("ha").textContent = d.hero_a; $("hb").textContent = d.hero_b; $("sub").textContent = d.sub;
  $("cta1").textContent = d.cta1; $("cta2").textContent = d.cta2;
  $("t_features").textContent = d.h_high; $("t_gallery").textContent = d.h_gallery; $("t_install").textContent = d.t_install;
  $("cards").innerHTML = d.cards.map(function(c){return '<div class="card"><div class="e">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div>'}).join("");
  $("gal").innerHTML = IMGS.map(function(n,i){return '<figure><img src="img/'+n+'.png" alt="'+d.gallery[i][0]+'" loading="lazy"><figcaption><b>'+d.gallery[i][0]+'</b> · '+d.gallery[i][1]+'</figcaption></figure>'}).join("");

  $("tab_unix").textContent = d.tab_unix; $("tab_win").textContent = d.tab_win;
  $("cmd").textContent = CMDS[tab]; $("or_agent").textContent = d.or_agent; $("prompt").textContent = d.prompt;

$("langs").innerHTML = Object.keys(NAMES).map(function(k){return '<button data-l="'+k+'">'+NAMES[k]+'</button>'}).join("");
$("langs").addEventListener("click", function(e){ var l = e.target.getAttribute("data-l"); if (l) { lang = l; try { localStorage.setItem("lang", l); } catch(x) {} render(); } });
$("tab_unix").onclick = function(){ tab = "unix"; render(); };
$("tab_win").onclick = function(){ tab = "win"; render(); };
function copy(text, btn){
  var done = function(){ var o = btn.textContent; btn.textContent = D[lang].copied; setTimeout(function(){ btn.textContent = D[lang].copy; }, 1400); };
  try { navigator.clipboard.writeText(text).then(done, function(){}); } catch(e) {}
}
$("cp1").onclick = function(){ copy(CMDS[tab], this); };
$("cp2").onclick = function(){ copy(D[lang].prompt, this); };
lang = pick(); render();
