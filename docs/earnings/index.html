<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSBC 季度財報 · AAPL 驗證</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font:14px/1.6 Arial,"PingFang TC",sans-serif}main{max-width:980px;margin:auto;padding:24px}h1{font-size:20px;font-weight:500}p{font-size:12px;color:#666}nav{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid #ccc;padding:8px 0}button{font:inherit;border:0;background:none;padding:4px 0;cursor:pointer}button[aria-pressed=true]{font-weight:600;border-bottom:2px solid #222}select{font:inherit;background:white;border:1px solid #aaa}img{display:block;width:100%;margin-top:16px;background:white}a{color:#34506c}.links{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:12px}@media(max-width:600px){main{padding:12px}}</style><main><h1>HSBC 季度財報 · AAPL 真實資料驗證</h1><p>股票代碼＋公司財季 → 官方財報 → 單季／同比／環比 → 研究解讀。這兩個示例使用 Apple 原始報表；HSBC 財報功能已納入 v0.6.0，預設繁體中文。</p><nav><button data-period="2025q3" aria-pressed="true">FY2025Q3</button><button data-period="2025q4" aria-pressed="false">FY2025Q4</button><select id="lang" aria-label="語言"><option value="zh">繁體中文</option><option value="en">English</option></select></nav><img id="image" alt="AAPL 季度財報表"><div class="links"><a id="png" download>下載PNG</a><a id="html">打開文字版</a><a id="facts">原始事實台帳</a><a id="audit">比較與計算台帳</a></div><p>示例使用官方歷史財報，並非即時數據。三角表示核心指標同比方向，並非投資評級；費用、現金與債務增減需結合背景。第四季已核對GAAP／非GAAP調節附錄。</p></main><script>const images={"2025q3_zh": "aapl_2025q3_zh.png", "2025q3_en": "aapl_2025q3_en.png", "2025q4_zh": "aapl_2025q4_zh.png", "2025q4_en": "aapl_2025q4_en.png"};let period='2025q3',lang='zh';function update(){document.getElementById('image').src=images[period+'_'+lang];const prefix='aapl_'+period;document.getElementById('png').href=images[period+'_'+lang];document.getElementById('png').download=prefix+'_'+lang+'.png';document.getElementById('html').href=prefix+'_'+lang+'.html';document.getElementById('facts').href=prefix+'_facts.json';document.getElementById('audit').href=prefix+'_audit.json';document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.period===period))}document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.period){period=e.target.dataset.period;update()}});document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;update()});update();</script></html>
